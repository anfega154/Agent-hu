  <rect x="245" y="112" width="200" height="28" rx="4" fill="#fafafa" stroke="#bbb"/><text x="270" y="131" font-size="11" fill="#666">Cumplimiento</text>
  <rect x="600" y="112" width="140" height="28" rx="4" fill="#3a6ea5" stroke="#2c5580"/><text x="618" y="131" fill="#fff" font-size="11">Generar</text>
