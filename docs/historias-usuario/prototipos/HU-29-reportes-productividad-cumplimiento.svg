  <text x="215" y="238" font-size="10" fill="#c0392b">IMP-021: columnas y fórmulas de cálculo Pendiente por definir.</text>
  <text x="35" y="305" font-size="10" fill="#888">CA-03: solo pantalla, sin exportación, bajo demanda. CA-01/CA-02 verificables al definir IMP-021.</text>
