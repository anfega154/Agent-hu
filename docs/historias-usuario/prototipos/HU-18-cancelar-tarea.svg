<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" font-family="Arial, sans-serif" font-size="13">
  <rect width="620" height="360" fill="#f5f6f8"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#333">HU-18 · Wireframe funcional — Cancelar tarea (Coordinador)</text>
  <text x="20" y="48" font-size="11" fill="#888">Cancelable desde cualquier estado excepto Cerrada (DEC-015b).</text>

  <rect x="20" y="70" width="580" height="260" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="35" y="94" font-weight="bold" fill="#555">Cancelar — Tarea #___</text>
  <rect x="35" y="120" width="540" height="50" rx="4" fill="#fff5f5" stroke="#e0a0a0"/>
  <text x="45" y="142" font-size="11" fill="#c0392b">¿Confirmar cancelación de la tarea?</text>
  <text x="45" y="160" font-size="10" fill="#888">¿Requiere confirmación explícita y/o motivo? — Pendiente por definir</text>
  <rect x="35" y="186" width="540" height="30" rx="4" fill="#fff9e6" stroke="#e0c56a" stroke-dasharray="4 3"/>
  <text x="45" y="205" font-size="10" fill="#8a6d1a">Motivo de cancelación (¿obligatorio?) — Pendiente por definir</text>
  <rect x="35" y="234" width="150" height="34" rx="4" fill="#c0392b"/>
  <text x="60" y="256" fill="#fff">Confirmar</text>
  <rect x="195" y="234" width="120" height="34" rx="4" fill="#e6e6e6" stroke="#bbb"/>
  <text x="225" y="256" fill="#555">Cancelar</text>
  <text x="35" y="300" font-size="10" fill="#888">CA-02: si la tarea está Cerrada, no permite cancelar.</text>

  <text x="20" y="345" font-size="10" fill="#999">Trazabilidad HU-18: VF-01, RN-01..RN-03, CA-01/CA-02, CP-01/CP-02.</text>
</svg>
