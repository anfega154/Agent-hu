<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" font-family="Arial, sans-serif" font-size="13">
  <rect width="720" height="400" fill="#f5f6f8"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#333">HU-17 · Wireframe funcional — Reasignar tarea (Coordinador)</text>
  <text x="20" y="48" font-size="11" fill="#888">Responsable único con histórico (DEC-001). Conserva estado previo (DEC-015a).</text>

  <rect x="20" y="70" width="680" height="300" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="35" y="94" font-weight="bold" fill="#555">Reasignar — Tarea #___ (estado actual: Retrasada, p. ej.)</text>
  <text x="35" y="126" font-size="11" fill="#666">Responsable actual: A (solo lectura)</text>
  <text x="35" y="156" font-size="11" fill="#666">Nuevo responsable</text>
  <rect x="35" y="164" width="540" height="28" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="560" y="182" font-size="11" fill="#888">▾</text>
  <rect x="35" y="206" width="540" height="30" rx="4" fill="#fff9e6" stroke="#e0c56a" stroke-dasharray="4 3"/>
  <text x="45" y="225" font-size="10" fill="#8a6d1a">Candidatos: Pendiente (IMP-018). Estados que permiten reasignar: Cerrada no (resto por confirmar).</text>
  <rect x="35" y="256" width="160" height="34" rx="4" fill="#3a6ea5" stroke="#2c5580"/>
  <text x="70" y="278" fill="#fff">Reasignar</text>
  <text x="210" y="278" font-size="10" fill="#888">CA-01: cambia responsable, notifica a B (HU-21), registra a A en histórico.</text>
  <text x="35" y="316" font-size="10" fill="#888">CA-02: tras reasignar, la tarea sigue Retrasada (conserva estado previo).</text>
  <text x="35" y="336" font-size="10" fill="#888">RC-01: transición "En reasignación" es un instante de auditoría, no reposo.</text>

  <text x="20" y="388" font-size="10" fill="#999">Trazabilidad HU-17: VF-01/VF-02, RN-01..RN-03, CA-01..CA-03.</text>
</svg>
