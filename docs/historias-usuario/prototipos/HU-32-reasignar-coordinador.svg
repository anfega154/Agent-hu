<svg xmlns="http://www.w3.org/2000/svg" width="620" height="340" font-family="Arial, sans-serif" font-size="13">
  <rect width="620" height="340" fill="#f5f6f8"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#333">HU-32 · Wireframe funcional — Reasignar coordinador de un equipo (Administrador)</text>
  <text x="20" y="48" font-size="11" fill="#888">Acción exclusiva del Administrador (DEC-003c). Un Coordinador por equipo.</text>

  <rect x="20" y="70" width="580" height="240" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="35" y="94" font-weight="bold" fill="#555">Reasignar coordinador — Equipo "___"</text>
  <text x="35" y="124" font-size="11" fill="#666">Coordinador actual: A (solo lectura)</text>
  <text x="35" y="154" font-size="11" fill="#666">Nuevo coordinador *</text>
  <rect x="35" y="162" width="540" height="28" rx="4" fill="#fafafa" stroke="#bbb"/><text x="560" y="181" font-size="11" fill="#888">▾</text>
  <rect x="35" y="204" width="540" height="26" rx="4" fill="#fff9e6" stroke="#e0c56a" stroke-dasharray="4 3"/>
  <text x="45" y="222" font-size="10" fill="#8a6d1a">¿El nuevo debe tener ya el rol Coordinador o se le asigna? — Pendiente (rel. IMP-015)</text>
  <rect x="35" y="248" width="150" height="34" rx="4" fill="#3a6ea5" stroke="#2c5580"/><text x="60" y="270" fill="#fff">Reasignar</text>
  <text x="200" y="270" font-size="10" fill="#888">CA-01/CA-02: reemplaza al coordinador; queda uno solo.</text>

  <text x="20" y="328" font-size="10" fill="#999">Trazabilidad HU-32: VF-01, RN-01/RN-02, CA-01/CA-02. RC-01: afecta alcance del panel (DEC-006).</text>
</svg>
