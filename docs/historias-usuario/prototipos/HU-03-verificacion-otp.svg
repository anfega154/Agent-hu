<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" font-family="Arial, sans-serif" font-size="13">
  <rect width="900" height="500" fill="#f5f6f8"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#333">HU-03 · Wireframe funcional — Verificación en dos pasos (/auth/verify)</text>
  <text x="20" y="48" font-size="11" fill="#888">Estados: uso (código incompleto) · error código · expirado.</text>

  <!-- uso -->
  <rect x="20" y="70" width="270" height="400" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="35" y="92" font-weight="bold" fill="#555">Estado: uso</text>
  <text x="35" y="120" fill="#333">Verifica tu identidad</text>
  <text x="35" y="146" font-size="10" fill="#888">Código enviado a: c***@***.com</text>
  <g>
    <rect x="35" y="160" width="30" height="34" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="70" y="160" width="30" height="34" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="105" y="160" width="30" height="34" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="140" y="160" width="30" height="34" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="175" y="160" width="30" height="34" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="210" y="160" width="30" height="34" rx="4" fill="#fafafa" stroke="#bbb"/>
  </g>
  <text x="35" y="216" font-size="10" fill="#888">6 dígitos · autoavance / pegado</text>
  <rect x="35" y="240" width="220" height="34" rx="4" fill="#cfd8e3" stroke="#9fb0c4"/>
  <text x="80" y="262" fill="#555">Verificar (deshabilitado)</text>
  <text x="35" y="300" font-size="10" fill="#888">CA-02: habilitado solo con 6 dígitos.</text>

  <!-- error -->
  <rect x="315" y="70" width="270" height="400" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="330" y="92" font-weight="bold" fill="#555">Estado: código inválido</text>
  <rect x="330" y="160" width="220" height="34" rx="4" fill="#fff5f5" stroke="#e0a0a0"/>
  <text x="330" y="222" font-size="10" fill="#c0392b">AUTH_003 — código inválido</text>
  <text x="330" y="250" font-size="10" fill="#888">CA-03: limpia los 6 campos y</text>
  <text x="330" y="264" font-size="10" fill="#888">devuelve foco al primero; sigue bloqueado.</text>

  <!-- expirado -->
  <rect x="610" y="70" width="270" height="400" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="625" y="92" font-weight="bold" fill="#555">Estado: código expirado</text>
  <rect x="625" y="160" width="220" height="34" rx="4" fill="#fff5f5" stroke="#e0a0a0"/>
  <text x="625" y="222" font-size="10" fill="#c0392b">AUTH_004 — código expirado</text>
  <text x="625" y="250" font-size="10" fill="#888">CA-04: no completa la autenticación.</text>
  <text x="625" y="278" font-size="10" fill="#888">Reenvío del código: ver HU-04.</text>

  <text x="20" y="490" font-size="10" fill="#999">Trazabilidad HU-03: VF-01..VF-03, CA-01..CA-05. Éxito AUTHENTICATED → /.</text>
</svg>
