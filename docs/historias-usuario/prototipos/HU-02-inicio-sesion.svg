<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" font-family="Arial, sans-serif" font-size="13">
  <rect width="900" height="520" fill="#f5f6f8"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#333">HU-02 · Wireframe funcional — Inicio de sesión (/auth/login)</text>
  <text x="20" y="48" font-size="11" fill="#888">Solo elementos especificados en la HU. Estados: uso · error credenciales · desvíos.</text>

  <!-- uso -->
  <rect x="20" y="70" width="270" height="410" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="35" y="92" font-weight="bold" fill="#555">Estado: uso</text>
  <text x="35" y="122" fill="#333">Iniciar sesión</text>
  <text x="35" y="150" font-size="11" fill="#666">Correo electrónico *</text>
  <rect x="35" y="158" width="220" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="35" y="208" font-size="11" fill="#666">Contraseña *</text>
  <rect x="35" y="216" width="220" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="243" y="236" font-size="11" fill="#888">👁</text>
  <rect x="35" y="270" width="220" height="34" rx="4" fill="#cfd8e3" stroke="#9fb0c4"/>
  <text x="90" y="292" fill="#555">Iniciar sesión (deshab.)</text>
  <text x="35" y="330" font-size="11" fill="#3a6ea5">Recuperar contraseña →</text>
  <text x="35" y="360" font-size="10" fill="#888">Botón deshabilitado si correo o</text>
  <text x="35" y="374" font-size="10" fill="#888">contraseña vacíos.</text>
  <text x="35" y="400" font-size="10" fill="#888">Nota: el rol se asigna automáticamente</text>
  <text x="35" y="414" font-size="10" fill="#888">al iniciar sesión (RN-01).</text>

  <!-- error -->
  <rect x="315" y="70" width="270" height="410" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="330" y="92" font-weight="bold" fill="#555">Estado: error credenciales</text>
  <text x="330" y="150" font-size="11" fill="#666">Correo electrónico *</text>
  <rect x="330" y="158" width="220" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="330" y="208" font-size="11" fill="#666">Contraseña *</text>
  <rect x="330" y="216" width="220" height="30" rx="4" fill="#fff5f5" stroke="#e0a0a0"/>
  <rect x="330" y="258" width="220" height="30" rx="4" fill="#fff5f5" stroke="#e0a0a0"/>
  <text x="340" y="277" font-size="10" fill="#c0392b">AUTH_005 — credenciales no válidas</text>
  <text x="330" y="330" font-size="10" fill="#888">Otros: AUTH_006 (no confirmada),</text>
  <text x="330" y="344" font-size="10" fill="#888">AUTH_008 (requiere reset),</text>
  <text x="330" y="358" font-size="10" fill="#888">AUTH_013 (demasiados intentos).</text>

  <!-- desvios -->
  <rect x="610" y="70" width="270" height="410" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="625" y="92" font-weight="bold" fill="#555">Desvíos según Cognito</text>
  <rect x="625" y="120" width="240" height="46" rx="4" fill="#eef7ee" stroke="#bcd" />
  <text x="635" y="140" font-size="10" fill="#2c6e2c">AUTHENTICATED → / (CA-01)</text>
  <text x="635" y="156" font-size="10" fill="#555">guarda sesión</text>
  <rect x="625" y="180" width="240" height="46" rx="4" fill="#f0f4ff" stroke="#c5d3f0"/>
  <text x="635" y="200" font-size="10" fill="#333">NEW_PASSWORD_REQUIRED →</text>
  <text x="635" y="216" font-size="10" fill="#333">/auth/new-password (HU-01)</text>
  <rect x="625" y="240" width="240" height="46" rx="4" fill="#f0f4ff" stroke="#c5d3f0"/>
  <text x="635" y="260" font-size="10" fill="#333">EMAIL_OTP / SMS_MFA →</text>
  <text x="635" y="276" font-size="10" fill="#333">/auth/verify (HU-03)</text>

  <text x="20" y="505" font-size="10" fill="#999">Trazabilidad HU-02: CA-01..CA-05, FA-01..FA-05. Fuera de alcance: SSO, selección de canal MFA.</text>
</svg>
