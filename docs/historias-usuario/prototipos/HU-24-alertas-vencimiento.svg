<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" font-family="Arial, sans-serif" font-size="13">
  <rect width="720" height="400" fill="#f5f6f8"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#333">HU-24 · Wireframe funcional — Alertas de vencimiento (próxima a vencer / retrasada)</text>
  <text x="20" y="48" font-size="11" fill="#888">Dos escenarios. Retraso inmediato (DEC-012, zona global DEC-011).</text>

  <!-- retraso (definido) -->
  <rect x="20" y="70" width="330" height="290" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="35" y="92" font-weight="bold" fill="#2c6e2c">Escenario A: RETRASADA (definido)</text>
  <rect x="35" y="115" width="300" height="70" rx="6" fill="#fff3e6" stroke="#e0a86a"/>
  <text x="45" y="138" font-size="11" fill="#8a5a1a">⚠ Tarea "___" retrasada</text>
  <text x="45" y="158" font-size="10" fill="#888">Destinatario: Coordinador (RN-02)</text>
  <text x="45" y="174" font-size="10" fill="#888">La tarea pasa a estado Retrasada (HU-15)</text>
  <text x="35" y="215" font-size="10" fill="#888">VF-01/CA-01: al cumplirse fecha/hora límite</text>
  <text x="35" y="231" font-size="10" fill="#888">(zona global) si no está Completada/Cerrada.</text>
  <text x="35" y="255" font-size="10" fill="#888">Inmediato, sin tolerancia (DEC-012).</text>

  <!-- proxima (bloqueado) -->
  <rect x="370" y="70" width="330" height="290" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="385" y="92" font-weight="bold" fill="#c0392b">Escenario B: PRÓXIMA A VENCER (bloqueado)</text>
  <rect x="385" y="115" width="300" height="70" rx="6" fill="#f7f7f7" stroke="#ccc" stroke-dasharray="4 3"/>
  <text x="395" y="138" font-size="11" fill="#888">🔔 Tarea "___" próxima a vencer</text>
  <text x="395" y="158" font-size="10" fill="#888">Destinatario: Colaborador responsable</text>
  <rect x="385" y="205" width="300" height="80" rx="4" fill="#fff5f5" stroke="#e0a0a0"/>
  <text x="395" y="228" font-size="10" fill="#c0392b">BLOQ-009: umbral "próxima a vencer" NO</text>
  <text x="395" y="244" font-size="10" fill="#c0392b">definido. Escenario no construible hasta</text>
  <text x="395" y="260" font-size="10" fill="#c0392b">definir cuánto antes del vencimiento alertar.</text>

  <text x="20" y="388" font-size="10" fill="#999">Trazabilidad HU-24: VF-01/VF-02, RN-01..RN-04, CA-01..CA-03. Sujeto a interruptor global (DEC-008).</text>
</svg>
