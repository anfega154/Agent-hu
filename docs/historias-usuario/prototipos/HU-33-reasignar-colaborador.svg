<svg xmlns="http://www.w3.org/2000/svg" width="620" height="340" font-family="Arial, sans-serif" font-size="13">
  <rect width="620" height="340" fill="#f5f6f8"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#333">HU-33 · Wireframe funcional — Reasignar colaborador a otro equipo (Administrador)</text>
  <text x="20" y="48" font-size="11" fill="#888">Un colaborador, un equipo (DEC-003a); siempre con equipo (DEC-014c). Asignación inicial en HU-08.</text>

  <rect x="20" y="70" width="580" height="240" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="35" y="94" font-weight="bold" fill="#555">Reasignar colaborador</text>
  <text x="35" y="124" font-size="11" fill="#666">Colaborador *</text>
  <rect x="35" y="132" width="540" height="28" rx="4" fill="#fafafa" stroke="#bbb"/><text x="560" y="151" font-size="11" fill="#888">▾</text>
  <text x="35" y="182" font-size="11" fill="#666">Equipo destino *</text>
  <rect x="35" y="190" width="540" height="28" rx="4" fill="#fafafa" stroke="#bbb"/><text x="560" y="209" font-size="11" fill="#888">▾</text>
  <rect x="35" y="232" width="540" height="26" rx="4" fill="#fff9e6" stroke="#e0c56a" stroke-dasharray="4 3"/>
  <text x="45" y="250" font-size="10" fill="#8a6d1a">Efecto sobre tareas ya activas del colaborador — Pendiente (IMP-022)</text>
  <rect x="35" y="270" width="150" height="30" rx="4" fill="#3a6ea5" stroke="#2c5580"/><text x="70" y="290" fill="#fff">Reasignar</text>
  <text x="200" y="290" font-size="10" fill="#888">CA-02: nunca queda sin equipo (pasa directo al destino).</text>

  <text x="20" y="328" font-size="10" fill="#999">Trazabilidad HU-33: VF-01/VF-02, RN-01..RN-03, CA-01/CA-02.</text>
</svg>
